
# This is a YAML file. It is used to store configuration data.

input: ../data/input.txt

output: ../data/output.txt


grid:
    Lx: 10 #14 #14 #10 sites in x
    Ly: 10 #14 #14 #10 # sites in y
    #eps: 1e-7

lists:
    dJUs:
        start: 0.0
        stop: 0.5
        num: 20

    energies:
        start: 0.01
        stop: 0.5
        num: 50

physics:
    N: 7 # 7 #Fock space cutoff
    dJU: 0.17 # this is 2 * d * J, so 4J in 2D.
    muU: "np.sqrt(2) - 1"
    UIB: 0.5
    cutoff: 3 # Num of modes.  0 is mean field


